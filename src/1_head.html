<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Yard Control · Blockline Labs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0a0c0f;--panel:#0e1114;--panel2:#13171b;--line:#1d2228;--line2:#2a3139;--text:#e9edf1;--muted:#7c8691;--dim:#4d5560;--lime:#c6f432;--cobalt:#3d6bff;--yellow:#f5c542;--red:#ff4b3e;
--sans:Inter,"Inter var",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}
#app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:52px minmax(0,1fr);height:100vh;min-width:1180px;min-height:760px}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0d10}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:700;letter-spacing:.22em;font-size:12px}
.mark{display:flex;gap:2px}.mark i{display:block;width:4px;height:16px;border-radius:1px}
.vsep{width:1px;height:20px;background:var(--line2)}
.product{font-weight:600;font-size:14px}
.chip-labs{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--yellow);border:1px solid rgba(245,197,66,.55);border-radius:4px;padding:3px 7px}
.grow{flex:1}
.hbox{font-family:var(--mono);font-size:11px;color:var(--text);display:flex;align-items:center;gap:8px}
.hbox span{color:var(--muted);font-size:9.5px;letter-spacing:.14em}
.scenario{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:7px 12px}
.live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;border:1px solid var(--line2);border-radius:20px;padding:6px 12px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.live.on{color:var(--yellow);border-color:rgba(245,197,66,.6)}
.live.on i{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
#left{display:grid;grid-template-rows:auto minmax(0,1fr) 108px;min-width:0;min-height:0;border-right:1px solid var(--line)}
#outcomes{padding:12px 18px 12px;border-bottom:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:9px}
.badge{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:3px 9px;color:#aab3bd}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 13px 10px;position:relative;min-width:0}
.tile .tt{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#aeb6bf}
.tile .tt .dot{width:7px;height:7px;border-radius:2px;background:var(--lime)}
.tile .simtag{margin-left:auto;font-size:8px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:1px 4px}
.tile .val{display:flex;align-items:baseline;gap:6px;margin:6px 0 3px}
.tile .val b{font-size:27px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .val small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tile .sub{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-lime{color:var(--lime)!important}.c-yellow{color:var(--yellow)!important}.c-red{color:var(--red)!important}.c-cobalt{color:#7d9bff!important}
#mapwrap{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.map-head{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 6px}
.map-title{font-weight:600;font-size:13px;display:flex;align-items:center;gap:10px}
.map-sub{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:3px}
.schip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;border-radius:4px;padding:2px 7px;font-weight:600}
.schip.ok{background:rgba(198,244,50,.12);color:var(--lime);border:1px solid rgba(198,244,50,.4)}
.schip.warn{background:rgba(245,197,66,.12);color:var(--yellow);border:1px solid rgba(245,197,66,.45)}
.schip.bad{background:var(--red);color:#fff;border:1px solid var(--red)}
.layers{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:4px 6px 4px 10px}
.layers button{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted);padding:3px 8px;border-radius:4px;display:flex;align-items:center;gap:5px}
.layers button::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid var(--dim)}
.layers button.on{color:var(--text)}.layers button.on::before{background:var(--lime);border-color:var(--lime)}
#mapbox{position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#dossier{position:absolute;width:236px;background:rgba(14,17,20,.94);border:1px solid var(--line2);border-radius:9px;padding:11px 12px;backdrop-filter:blur(6px);font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#dossier.sel{border-color:rgba(61,107,255,.75);box-shadow:0 0 0 1px rgba(61,107,255,.25),0 10px 30px rgba(0,0,0,.45)}
.dz-k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted)}
.dz-head{display:flex;align-items:center;justify-content:space-between;margin:5px 0 9px}
.dz-id{font-family:var(--mono);font-size:15px;font-weight:600}
.dz-pill{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;border-radius:3px;padding:2px 6px;font-weight:600}
.dz-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px}
.dz-row span:first-child{color:var(--muted);font-size:9px;letter-spacing:.12em}
.socbar{display:inline-block;width:54px;height:4px;border-radius:2px;background:#262c33;margin-right:7px;vertical-align:middle;overflow:hidden}
.socbar i{display:block;height:100%}
.dz-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.dz-chips i{width:15px;height:6px;border-radius:1.5px}
.dz-empty{color:var(--muted);font-size:11px;line-height:1.45}
.dz-x{font-family:var(--mono);color:var(--dim);font-size:13px;padding:0 2px}
#legend{position:absolute;right:14px;bottom:12px;background:rgba(14,17,20,.92);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;display:grid;grid-template-columns:auto auto auto;gap:4px 18px;font-family:var(--mono);font-size:9px;color:#aab3bd}
#legend .lh{font-size:8px;letter-spacing:.14em;color:var(--dim)}
#legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
#legend em{display:inline-block;width:16px;height:2px}
#legend b{display:inline-block;width:10px;height:5px;border-radius:1px}
#bottom{display:grid;grid-template-columns:330px 1fr;border-top:1px solid var(--line);background:#0b0d10;min-width:0}
.transport{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 18px;border-right:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:10px}
#play{width:46px;height:46px;border-radius:50%;background:var(--lime);color:#0a0c0f;display:grid;place-items:center;position:relative;box-shadow:0 0 0 0 rgba(198,244,50,.5);transition:transform .1s}
#play:hover{transform:scale(1.05)}
#play.idle{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,244,50,.45)}70%{box-shadow:0 0 0 12px rgba(198,244,50,0)}100%{box-shadow:0 0 0 0 rgba(198,244,50,0)}}
.cbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--text)}
.cbtn:hover{border-color:#4a535d;background:var(--panel2)}
.clock .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted)}
.clock .t{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px}
.seg button{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:5px 11px;background:var(--panel)}
.seg button.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.rbtn{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:5px 10px;margin-left:auto}
.rbtn:hover{color:var(--text)}
.tl{display:grid;grid-template-rows:auto minmax(0,1fr);padding:9px 16px 6px;min-width:0}
.tl-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--muted)}
.tl-head .lg{display:flex;gap:12px}.tl-head .lg span{display:flex;align-items:center;gap:5px}
.tl-head .lg i{display:inline-block;width:8px;height:8px;border-radius:2px}
.tlbox{position:relative;min-height:0}#tl{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{display:flex;flex-direction:column;background:#0b0d10;overflow-y:auto;min-height:0}
.ph{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.ph .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--lime)}
.ph .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px}
.ph h2{font-size:15px;font-weight:600}
.ph button{font-size:11px;color:var(--muted)}.ph button:hover{color:var(--text)}
.grp{padding:11px 20px 2px;border-bottom:1px solid var(--line)}
.grp>.k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);margin-bottom:10px}
.var{margin-bottom:10px}
.var .vh{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.var .vh b{font-family:var(--mono);font-size:11.5px;font-weight:600}
.var .vr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px}
.var .note{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;--c:var(--lime);--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--c) 0,var(--c) var(--p),#2a3038 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#0e1114;border:2.5px solid var(--c);margin-top:-6px}
input[type=range]::-moz-range-track{height:3px;background:#2a3038;border-radius:2px}
input[type=range]::-moz-range-progress{height:3px;background:var(--c)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#0e1114;border:2.5px solid var(--c)}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:12px}
.sw{width:34px;height:18px;border-radius:10px;background:#2a3038;position:relative;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#7c8691;transition:.15s}
.sw.on{background:var(--lime)}.sw.on::after{left:19px;background:#0a0c0f}
.rule{display:flex;gap:5px;margin-bottom:7px}
.rule button{flex:1;font-size:11.5px;border:1px solid var(--line2);border-radius:6px;padding:7px 0;background:var(--panel);color:#c5ccd3}
.rule button.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.rdesc{font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:12px;min-height:32px}
.fault{border:1px solid var(--line2);border-radius:8px;padding:11px 12px;margin-bottom:12px;background:var(--panel)}
.fault.on{border-color:rgba(255,75,62,.6);background:rgba(255,75,62,.06)}
.fault .fh{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.fault .fs{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin:4px 0 10px;line-height:1.5}
.fbtn{width:100%;font-weight:600;font-size:12.5px;border-radius:6px;padding:9px 0;border:1px solid var(--red);color:var(--red)}
.fbtn:hover{background:rgba(255,75,62,.1)}
.fault.on .fbtn{background:var(--red);color:#fff}
.foot{padding:12px 20px 16px;font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.6;margin-top:auto}
kbd{font-family:var(--mono);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--muted)}

#zoomctl{position:absolute;top:10px;right:14px;display:flex;align-items:center;gap:2px;background:rgba(14,17,20,.92);border:1px solid var(--line2);border-radius:7px;padding:3px;font-family:var(--mono);z-index:3}
#zoomctl button{width:26px;height:24px;border-radius:5px;color:#c5ccd3;font-size:14px;line-height:1}
#zoomctl button:hover{background:var(--panel2);color:#fff}
#zoomctl #zFit{width:auto;padding:0 8px;font-size:10.5px;letter-spacing:.06em}
#zPct{min-width:44px;text-align:center;font-size:10.5px;color:var(--text)}
#mini{position:absolute;top:44px;right:14px;width:210px;height:100px;border:1px solid var(--line2);border-radius:7px;cursor:pointer;display:none;z-index:3}
#replayBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:rgba(61,107,255,.16);border:1px solid rgba(61,107,255,.7);border-radius:20px;padding:5px 6px 5px 14px;font-family:var(--mono);font-size:11px;backdrop-filter:blur(6px);z-index:3}
#replayBar .rb-k{color:#8fa8ff;letter-spacing:.14em;font-size:10px;font-weight:700}
#replayBar b{font-size:12px}
#replayBar #rbLive{color:var(--muted);font-size:10px}
#replayBar button{background:var(--lime);color:#0a0c0f;border-radius:14px;padding:4px 11px;font-weight:700;font-size:10.5px;font-family:var(--mono)}
.live.replay{color:#8fa8ff;border-color:rgba(61,107,255,.7)}.live.replay i{background:var(--cobalt);box-shadow:0 0 8px var(--cobalt);animation:none}
.tl-head .tlh-l{white-space:nowrap;display:flex;align-items:center;gap:10px}
#liveBtn{font-family:var(--mono);font-size:9px;letter-spacing:.12em;border:1px solid var(--line2);border-radius:10px;padding:2px 8px;color:var(--muted);display:flex;align-items:center;gap:5px}
#liveBtn i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
#liveBtn.on{color:var(--lime);border-color:rgba(198,244,50,.45)}#liveBtn.on i{background:var(--lime)}
#liveBtn.go{color:#0a0c0f;background:var(--lime);border-color:var(--lime);cursor:pointer}#liveBtn.go i{background:#0a0c0f}
#tl{cursor:pointer;touch-action:none}
#map{touch-action:none}
#tltip{position:absolute;pointer-events:none;display:none;background:rgba(14,17,20,.97);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:10px;color:var(--text);white-space:nowrap;transform:translate(-50%,-100%);z-index:5;line-height:1.5}
#tltip .k{color:var(--muted)}
</style></head>
